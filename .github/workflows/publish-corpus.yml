# The corpus publisher.
#
# This repository owns the job; the Brain owns the emitter it runs
# (neomjs/neo-agent-brain#387). The contract between them, in one line: the
# emitter's EXIT CODE is the whole verdict, once per origin. Zero means all four
# outcomes advanced — release reference, issues, discussions, pulls — and only
# when every origin exits zero is there anything to publish. Every other
# outcome, including a partial facet failure that left real content on disk,
# is nonzero and publishes nothing.
#
# Nothing here reads the emitter's output to decide. That is deliberate: a
# publisher that parses prose eventually publishes on a message it misread.
name: Publish corpus

on:
  schedule:
    # Hourly, off the hour so it does not pile onto the top-of-hour rush shared
    # by every cron on the runner fleet. Hourly because this cadence is the
    # Knowledge Base's freshness floor once the Brain consumes the corpus, and
    # the Brain's projection SLA assumes hourly emission (neomjs/neo#17627).
    # A cron is a configured cadence, not a publication-age guarantee: GitHub
    # may delay or drop scheduled runs, and the concurrency group below holds
    # ONE pending run — a newer schedule replaces it while a run is in flight —
    # so a run longer than an hour skips slots rather than stacking them. Move
    # to '17 */2 * * *' if hourly incremental runs draw secondary-limit 403s or
    # routinely exceed 60 minutes (#12).
    - cron: '17 * * * *'
  workflow_dispatch:

# One publication at a time. Two runs interleaving would race on the same
# branch, and the loser's push would rewrite a revision the winner just made.
# Never cancel a run in flight: it may be mid-commit.
concurrency:
  group: publish-corpus
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    env:
      # The live origin set, `neo` first: one token per source repository. The
      # emit step runs the emitter once per token and the publish step stages
      # exactly these roots, so adding an origin is adding a token here — its
      # tree is created by its first emission. Sequential by nature, not by
      # choice: the emitter's lease and the shared `_index.json` are corpus-wide.
      ORIGINS: neo neo-agent-brain neo-agent-institution neo-agent-skills devindex

    steps:
      - name: Check out the corpus
        uses: actions/checkout@v7
        with:
          # Always `dev`, never the event ref. `workflow_dispatch` lets a caller
          # select any branch, and the publish step pushes `HEAD:dev` — so a
          # dispatch from a feature branch would fast-forward that branch's whole
          # history into `dev`. Staging exact paths bounds the commit's DIFF; it
          # does nothing about its ANCESTRY. Reproduced by @neo-gpt-emmy on PR #2.
          ref: dev

      # The runtime is the Brain's `dev` tip, resolved when the run starts —
      # never a pin kept here. A pin is a maintained artifact nobody maintains
      # (#16 was the one bump, by hand, hours after the fix it carried had
      # merged), and the protection it claimed is already the exit-code
      # verdict below: a tip that breaks the emitter exits nonzero and
      # publishes nothing; the next green tip publishes an hour later. Which
      # revision actually ran is recorded on the publication commit as a
      # `Brain-Runtime:` trailer — provenance as a record, not a pin (#18).
      - name: Check out the Brain at its dev tip
        uses: actions/checkout@v7
        with:
          repository: neomjs/neo-agent-brain
          ref: dev
          path: .runtime

      - name: Record the runtime revision
        id: runtime
        working-directory: .runtime
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "Brain runtime: ${sha} (dev tip at checkout)"

      # The Brain declares `engines.node >= 24.0.0`; the ubuntu-latest image
      # currently ships Node 22.x, so `npm ci` would install against a runtime the
      # package does not support. Select it explicitly rather than inheriting
      # whatever the image happens to carry this month.
      - name: Select the Node version the runtime requires
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install the runtime
        working-directory: .runtime
        run: |
          set -euo pipefail
          node --version
          npm ci
          npm run prepare

      # An absent corpus mode is NOT a safe no-op. The pre-#387 CLI ignores an
      # unknown --corpus-only and selects FULL MANUAL MODE, which materializes
      # release notes, derives Portal artifacts and pushes issues back to
      # GitHub — precisely the effects this job must never cause. A `dev` tip
      # that regressed the mode must be refused here, before the emitter is
      # invoked, rather than trusted to fail on its own.
      - name: Verify the runtime supports corpus mode
        working-directory: .runtime
        env:
          BRAIN_RUNTIME: ${{ steps.runtime.outputs.sha }}
        run: |
          set -euo pipefail
          if ! grep -rqs -- 'corpus-only' ai/scripts/maintenance/syncGithubWorkflow.mjs; then
            echo "::error::Brain dev at ${BRAIN_RUNTIME} has no --corpus-only mode. The flag would be IGNORED and a full manual sync would run. Refusing to invoke it."
            exit 1
          fi
          echo "Corpus mode present in the runtime."

      - name: Emit the corpus
        working-directory: .runtime
        env:
          NEO_MCP_GITHUB_OWNER: neomjs
          # `NEO_MCP_GITHUB_REPO` is set per origin in the loop below.
          # Absolute, and the directory already exists because it is this
          # repository's own checkout. The emitter refuses a missing, invalid
          # or escaping destination before it even imports itself.
          NEO_MCP_GITHUB_CONTENT_ROOT: ${{ github.workspace }}
          # The source repository is PUBLIC, and an Actions-injected token can already read it:
          # a probe on this repo's runner returned real `neomjs/neo` discussions and pull
          # requests over GraphQL, which is the API the emitter mainly uses. So the default
          # token is the zero-setup path and the secret is the override, not the requirement.
          # If a REST call turns out to need more, the org's established answer is an App
          # installation token (`actions/create-github-app-token@v3`) with permissions
          # requested EXPLICITLY, per `neomjs/neo`'s data-sync-pipeline.yml — not a PAT.
          GH_TOKEN: ${{ secrets.CORPUS_SOURCE_READ_TOKEN || github.token }}
          # The emitter's own default is `warn`, which left a 36-minute run with
          # nothing between "Starting" and "complete" — and the 403 runs of
          # 2026-09-19/20 undiagnosable from their logs. Per-facet progress is
          # the minimum a scheduled run must leave behind.
          NEO_LOG_LEVEL: info
        run: |
          set -euo pipefail

          # One invocation per origin, in order. `set -e` makes the loop
          # fail-fast: the first nonzero exit ends this step, Publish never runs,
          # and the branch stays where it was. Nothing here reads the emitter's
          # output to decide.
          for repo in $ORIGINS; do
            echo "::group::Origin ${repo}"
            NEO_MCP_GITHUB_REPO="$repo" npm run ai:sync-github-workflow -- --corpus-only --verbose
            echo "::endgroup::"
          done

      # Reached only when the step above exited 0. A failed emission ends the
      # job here, and its half-written files die with the runner rather than
      # being cleaned up by a step that could itself fail.
      - name: Publish
        env:
          BRAIN_RUNTIME: ${{ steps.runtime.outputs.sha }}
        run: |
          set -euo pipefail

          # Exactly the published paths — the index and the origin roots the
          # emit step just wrote. Never `git add -A`: the runtime checkout and
          # the transient lock live in this workspace too, and a blanket add is
          # how they would reach a revision.
          git add -- _index.json $ORIGINS

          if git diff --cached --quiet; then
            echo "Corpus is already current; nothing to publish."
            exit 0
          fi

          # Content and index travel together. They are one publication unit,
          # so the delivered revision identifies the files and their index.
          # The trailer names the Brain revision that emitted them; the replay
          # below carries the message, so it survives a moved `dev`.
          git -c user.name='Neo Corpus Publisher' \
              -c user.email='neo-opus-vega@neomjs.com' \
              commit -m 'chore(corpus): publish org conversations [skip ci]' \
                     -m "Brain-Runtime: ${BRAIN_RUNTIME}"

          # Second layer on the ancestry boundary, independent of the checkout
          # above: the commit pushed must sit DIRECTLY on the published tip.
          # Any other parent means this push would carry history into `dev` that
          # nothing reviewed — which is what a staged-path restriction cannot see.
          #
          # `dev` may have moved while the emitter ran (a reviewed merge landing
          # mid-run cost run 35592845470 its 39 minutes). The publication commit
          # is replayed onto the fetched tip — a cherry-pick, not a rebase, since
          # this clone is shallow and has no merge base — under three checks that
          # are verified, never assumed:
          #   1. admission: the tip changed NO corpus path since the emission
          #      base; otherwise the emission is stale or a second writer exists;
          #   2. custody: rename detection is off, and the replayed commit must
          #      touch exactly the publication's paths — a clean rename on the
          #      tip could otherwise carry a corpus edit to a non-corpus path
          #      (reproduced by @neo-gpt-emmy on PR #15);
          #   3. ancestry: the parent check below runs again after the replay.
          git fetch --depth=1 origin dev
          if [ "$(git rev-parse HEAD^)" != "$(git rev-parse FETCH_HEAD)" ]; then
            publication="$(git rev-parse HEAD)"
            base="$(git rev-parse HEAD^)"
            tip="$(git rev-parse --short FETCH_HEAD)"
            echo "dev moved to ${tip} during the run; replaying publication ${publication:0:7} onto it."

            if [ -n "$(git diff --name-only "$base" FETCH_HEAD -- _index.json $ORIGINS)" ]; then
              echo "::error::Refusing to publish: origin/dev ${tip} changed corpus paths since the emission base ${base:0:7} — the emission is stale or a second writer touched the corpus."
              exit 1
            fi

            git checkout -q --detach FETCH_HEAD
            if ! git -c user.name='Neo Corpus Publisher' \
                    -c user.email='neo-opus-vega@neomjs.com' \
                    cherry-pick -X no-renames "$publication"; then
              git cherry-pick --abort
              echo "::error::Refusing to publish: replaying publication ${publication:0:7} onto origin/dev ${tip} conflicted."
              exit 1
            fi

            if [ "$(git diff-tree --no-commit-id --name-only -r "$publication" | sort)" != "$(git diff-tree --no-commit-id --name-only -r HEAD | sort)" ]; then
              echo "::error::Refusing to publish: the replayed commit touches different paths than publication ${publication:0:7}."
              exit 1
            fi
          fi
          if [ "$(git rev-parse HEAD^)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "::error::Refusing to publish: HEAD's parent $(git rev-parse --short HEAD^) is not the current origin/dev $(git rev-parse --short FETCH_HEAD)."
            exit 1
          fi

          git push origin HEAD:dev

      - name: Report the published revision
        if: success()
        env:
          BRAIN_RUNTIME: ${{ steps.runtime.outputs.sha }}
        run: |
          echo "### Corpus publication" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Brain runtime (dev tip at checkout): \`${BRAIN_RUNTIME}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- revision: \`$(git rev-parse HEAD)\`" >> "$GITHUB_STEP_SUMMARY"
